async function importFiles(files){
  let ok = 0, bad = [];
  for (const f of Array.from(files || [])){
    try {
      const s = parseGameText(await f.text());
      if (!s){ bad.push(f.name); continue; }
      s.id = newId(); s.updatedAt = Date.now() + ok; s.createdBy = Store.uid;
      if (!s.title.trim() || s.title === 'Ohne Titel') s.title = f.name.replace(/\.(json|txt)$/i, '');
      saveSet(s); ok++;
    } catch(e){ bad.push(f.name); }
  }
  render();
  if (ok && !bad.length) toast(ok === 1 ? 'Spiel geladen' : ok + ' Spiele geladen');
  else if (ok) toast(ok + ' geladen – nicht lesbar: ' + bad.join(', '), 6000);
  else toast('Die Datei enthält kein Spiel. Nutze eine Datei aus «Herunterladen».', 5000);
}
/* Namen anderer Personen erst beim Anzeigen auflösen (gespeichert wird nur die id). */
async function resolveAuthors(){
  const els = Array.from(document.querySelectorAll('[data-author]'));
  if (!els.length || !Store.user) return;
  const ids = Array.from(new Set(els.map(el => el.dataset.author)));
  const ps = await Store.user.profiles(ids);
  els.forEach(el => { const p = ps[el.dataset.author]; if (p && p.name) el.textContent = p.name; });
}

document.addEventListener('change', e => {
  if (e.target.id === 'file-in'){ importFiles(e.target.files); e.target.value = ''; return; }
  if (e.target.dataset && e.target.dataset.share){
    const s = S.sets[e.target.dataset.share]; if (!s) return;
    s.shared = e.target.checked; s.updatedAt = Date.now(); saveSet(s);
    toast(s.shared ? '«' + s.title + '» ist für die Sammlung vorgemerkt. Sag Claude «Aktualisiere die Sammlung».' : '«' + s.title + '» wird nicht mehr geteilt (beim nächsten Aktualisieren der Sammlung entfernt).', 6000);
    return;
  }
  if (e.target.dataset && e.target.dataset.setupClass !== undefined && S.setup){
    const U = S.setup, set = U.mode === 'edit' ? S.rounds[U.roundId].board : S.sets[U.setId];
    U.classId = e.target.value; U.present = {};
    const k = S.classes.find(x => x.id === U.classId);
    if (!U.nameTouched && set) U.name = (k ? k.name + ' – ' : '') + set.title;
    render();
    const again = $('#setup-class'); if (again) again.focus();
    return;
  }
  const t = e.target, k = t.dataset && t.dataset.edSize;
  if (!k || !S.editor) return;
  S.editor.draft[k] = +t.value;
  markDirty(); renderEditor();
  const again = $('#ed-' + k); if (again) again.focus();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.setupName !== undefined && S.setup){ S.setup.teams[+t.dataset.setupName].name = t.value; return; }
  if (t.dataset.setupMembers !== undefined && S.setup){ S.setup.teams[+t.dataset.setupMembers].members = t.value; return; }
  if (t.dataset.setupField === 'name' && S.setup){ S.setup.name = t.value; S.setup.nameTouched = true; return; }
  if (t.dataset.cls && S.classEd){
    const k = S.classEd.list[S.classEd.sel]; if (!k) return;
    if (t.dataset.cls === 'name'){
      k.name = t.value;
      const b = document.querySelector('.cls-item[aria-current="true"] b'); if (b) b.textContent = t.value || 'Neue Klasse';
    } else {
      k.students = t.value;
      const sm = document.querySelector('.cls-item[aria-current="true"] small'); if (sm) sm.textContent = splitNames(t.value).length + ' Namen';
    }
    return;
  }
  if (t.id === 'answer-main' && S.round){ S.round.answer = t.value; return; }
  if (t.dataset.ai && S.editor){
    S.editor.ai[t.dataset.ai] = t.value;
    if (t.dataset.ai !== 'answer'){ S.aiLast = S.aiLast || {}; S.aiLast[t.dataset.ai] = t.value; }
    return;
  }
  if (t.dataset.heir !== undefined && S.round){ S.round.heirs[t.dataset.heir] = t.value; return; }
  const k = t.dataset.ed;
  if (k && S.editor){
    const d = S.editor.draft;
    if (k === 'title') d.title = t.value;
    else if (k === 'time') d.times[+t.dataset.r] = t.value;
    else if (k === 'value'){ d.values[+t.dataset.r] = t.value; const s = document.querySelector('[data-rowval="' + t.dataset.r + '"]'); if (s) s.textContent = t.value; }
    else if (k === 'answerSecs' || k === 'inheritSecs' || k === 'startCapital') d[k] = t.value;
    else if (k === 'cat'){ d.categories[+t.dataset.c].name = t.value; const n = $('#ed-tabname-' + t.dataset.c); if (n) n.textContent = t.value; }
    else d.categories[+t.dataset.c].qs[+t.dataset.r][k] = t.value;
    markDirty();
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.heir !== undefined){
    e.preventDefault();
    const all = Array.from(document.querySelectorAll('[data-heir]'));
    const i = all.indexOf(t);
    if (i < all.length - 1) all[i + 1].focus(); else evalInherit();
    return;
  }
  if (e.key === 'Enter' && t.id === 'pop-score'){ e.preventDefault(); ACT.popSave(); return; }
  if (e.key === 'Escape' && (S.teamPop != null || S.review) && !S.classEd){ ACT.popClose(); }
});

/* =========================================================
   Start
   ========================================================= */
function boot(){
  try { if (localStorage.getItem('mj-sound') === '0') S.sound = false; } catch(e){}
  const legacyLocal = Local.get('board');
  S.sets = normalizeSets(Local.get('sets'));
  // Sammlung laden. Gibt es keine (z. B. Datei direkt geöffnet) und noch keine Spiele, das Mathe-Beispiel anlegen.
  loadCollection().then(list => {
    S.collection = list;
    if (!list && !Store.db && !Object.keys(S.sets).length){ const s = makeExampleSet(legacyLocal); S.sets[s.id] = s; Local.set('sets', S.sets); }
    if (S.view === 'library' && !S.editor && !S.round && !S.classEd) render();
  });
  S.rounds = normalizeRounds(Local.get('rounds'));
  if (!Object.keys(S.rounds).length){   // frühere Einzel-Runde übernehmen
    const old = fixGame(Local.get('game'), legacyLocal);
    if (old){ S.rounds[old.id] = old; Local.set('rounds', S.rounds); }
  }
  S.classes = normalizeClasses(Local.get('classes'));
  render();

  if (window.claude && window.claude.use){
    window.claude.use('sample').then(fn => { S.sample = fn || null; if (S.editor && S.sample) renderEditor(); }).catch(() => {});
  }

  Store.init().then(async () => {
    if (!Store.db) return;
    const [sets, rounds, classes, legacy] = await Promise.all([
      Store.listSets(),
      Store.listCol(Store.roundsCol),
      Store.classesPath ? Store.getDoc(Store.classesPath) : Promise.resolve(null),
      Store.getDoc('app/board')
    ]);
    if (sets === null) return; // Lesen fehlgeschlagen: lokale Daten behalten
    const m = normalizeSets(sets);
    if (Object.keys(m).length){ S.sets = m; Local.set('sets', S.sets); }
    else { S.sets = {}; saveSet(makeExampleSet(legacy)); }   // erstes Öffnen: bisherige Tafel übernehmen
    if (!Store.uid) return;   // ohne Benutzer-Id bleiben Runden und Klassen nur im Browser
    const busy = S.view !== 'library' || S.round || S.editor || S.classEd;
    if (rounds !== null && !busy){
      const rm = normalizeRounds(rounds);
      if (!Object.keys(rm).length){
        // Umstieg auf mehrere Runden: frühere Einzel-Runde übernehmen (eigene, sonst die alte gemeinsame der Besitzerin/des Besitzers)
        let old = await Store.getDoc(Store.gamePath);
        if (!old && Store.isOwner) old = await Store.getDoc('app/game');
        const g = fixGame(old, legacy);
        if (g){ rm[g.id] = g; Store.write(Store.roundsCol + '/' + g.id, g); }
      }
      S.rounds = rm; Local.set('rounds', S.rounds);
    }
    if (classes && Array.isArray(classes.list) && !S.classEd){ S.classes = normalizeClasses(classes.list); Local.set('classes', S.classes); }
    if (!S.round && !S.editor && !S.classEd && S.view === 'library') render();
  });
}
boot();
})();
</script>
